# =============================================================================
# 稳定档 profile — RTX 4060 Laptop 8GB 首选
# 原则: 口型独占 GPU, TTS 纯 CPU。双常驻 CUDA 模型 = 失败模式。
# =============================================================================

profile: stable_8g
description: Ultralight 口型(GPU) + CosyVoice-300M(CPU, 独立进程) + WebRTC/virtualcam 预览 720p25

paths:
  repo_root: ..                      # 相对本配置文件, 由 orchestrator 解析为绝对路径
  vendor_livetalking: vendor/LiveTalking
  vendor_cosyvoice: vendor/CosyVoice
  python_livetalking: .venv-lt/Scripts/python.exe     # LiveTalking venv
  python_tts: .venv-lt/Scripts/python.exe             # CosyVoice 依赖装在共用 venv（bootstrap §6; 不再有 .venv-tts）
  logs_dir: logs
  data_dir: data

# ─── LiveTalking (口型 + 输出) ───────────────────────────────────────────────
livetalking:
  enabled: true
  workdir: vendor/LiveTalking
  entry: app.py
  # 以下 key 与 vendor/LiveTalking/config.py 的 argparse 一一对应 (yaml 直接透传)
  model: ultralight                  # musetalk / wav2lip / ultralight
  avatar_id: ultralight_avatar1      # data/avatars/<avatar_id>/
  batch_size: 8                      # 官方默认 16; 8G 卡先 8, bench 后再调
  fps: 25                            # 官方注释: must be 25
  tts: omnitts                       # 对接本仓库 tts_gateway 的协议
  TTS_SERVER: http://127.0.0.1:8011  # tts_gateway 监听地址
  REF_FILE: default                  # 网关侧音色名 (voices.yaml 中定义)
  REF_TEXT: ''
  transport: webrtc                  # webrtc(预览) / virtualcam(需 OBS 虚拟摄像头驱动) / rtmp / rtcpush
  # push_url: rtmp://127.0.0.1/live/livestream   # transport=rtmp/rtcpush 时必配（无预览页直推流媒体服务器）
  # LLM 智能问答（编排器 POST /chat 或 vendor /human type=chat 时生效; 默认关）:
  #   密钥走环境变量不入库: setx DASHSCOPE_API_KEY sk-xxx（or orcarouter 用 ORCAROUTER_API_KEY）
  # llm_provider: dashscope           # dashscope / orcarouter（OpenAI 兼容）
  # llm_model: qwen-plus
  listenport: 8010
  max_session: 2                     # 单机直播 1 路足够, 留 1 个备用
  config_file: ''                    # 为空时不额外下发 vendor 侧 yaml, 全部走 CLI

  env:
    PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True,max_split_size_mb:128
    LT_IDLE_WINDOW: ''               # 待机动作: 无声时只在嘴部最安静的一小段乒乓循环(留空=自动挑, 见 vendor_patches.md patch 3)

# ─── TTS 网关 (CosyVoice-300M, CPU) ─────────────────────────────────────────
tts:
  enabled: true
  device: cpu                        # 硬约束: stable 档禁止 gpu, 除非 bench 证明有余量
  listen_host: 127.0.0.1
  listen_port: 8011
  model_dir: vendor/CosyVoice/pretrained_models/CosyVoice-300M-SFT  # SFT 版含内置音色 spk2info.pt (中文女/中文男等)
  mode: sft                          # sft(内置音色) / zero_shot(克隆, 需 ref wav+text)
  spk_id: 中文女
  sample_rate: 22050                 # 300M 输出采样率, 网关重采样到 16k 交口型
  stream: true
  max_text_len: 200                  # 超长文本先切句再进模型
  env:
    PYTORCH_CUDA_ALLOC_CONF: ''      # CPU 推理不需要
    OMP_NUM_THREADS: '6'             # CPU 推理线程数, 别占满核跟口型抢 CPU

# ─── 编排器 ─────────────────────────────────────────────────────────────────
orchestrator:
  listen_host: 127.0.0.1
  listen_port: 8020                  # /say /interrupt /status /healthz
  text_queue:
    max_pending: 16                  # 队列上限, 超出丢弃最旧并告警
    min_interval_ms: 300             # 按弹幕节奏限流
    merge_window_ms: 800             # 短句合并窗口
  watchdog:
    enabled: true
    sample_interval_s: 5             # nvidia-smi 采样周期
    vram_scope: owned                # owned=只统计本项目进程组(推荐) / total=整卡
    vram_limit_mb: 4500              # 本链口径上限(含 OBS 时); 超限 → 降级
    vram_total_cap_mb: 7300          # 整卡接近满只告警, 不重启
    vram_rise_window_min: 15         # 显存爬升判定窗口
    vram_rise_threshold_mb: 300      # 窗口内单调上涨超过该值 → 判泄漏
    fps_floor: 20                    # 日志 inferfps/finalfps < 20 持续 30s → 重启口型
    fps_floor_duration_s: 30
    temp_limit_c: 75                 # 笔记本温度红线; 超了先降负载
    on_vram_exceed: degrade          # degrade / restart_lip / alert_only
    degrade_target: fallback_8g
  startup:
    order: [tts, livetalking]        # TTS 先起, LiveTalking 的 TTS_SERVER 才能通
    ready_timeout_s: 180             # 模型加载超时
    port_probe_interval_s: 2

# ─── 输出与预览 ─────────────────────────────────────────────────────────────
output:
  preview_resolution: 720p25         # 确认余量后手动升 1080p25
  obs:
    check_running: false             # 冒烟阶段 false; 真直播 true
    profile_json: configs/obs_nvenc_720p25.json

# ─── 日志 ───────────────────────────────────────────────────────────────────
logging:
  dir: logs
  level: INFO
  console: true
  rotate_mb: 20
  keep_files: 10
